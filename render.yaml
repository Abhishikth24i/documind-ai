services:
  - type: web
    name: documind-ai
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: MAX_DOCS_PER_SESSION
        value: "10"
